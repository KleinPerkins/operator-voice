[project]
name = "operator-voice"
version = "0.1.15"
description = "Operator Voice Toolkit (OVT) — durable voice memory and application layer for agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "KleinPerkins" }]
dependencies = [
    "cryptography>=50.0.0,<51.0",
    "mcp>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<6.0",
    "hypothesis>=6.100,<7.0",
]

[project.scripts]
operator-voice = "operator_voice.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "keychain: exercises the real macOS Keychain via a disposable throwaway keychain file (never the operator's login keychain)",
    "e2e: slow, network-touching (PyPI) end-to-end coverage of install.sh against a disposable HOME",
]

[tool.uv]
package = true
